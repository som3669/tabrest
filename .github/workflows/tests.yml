name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The tests drive a real browser: MV3 service workers do not run in
      # headless mode, so Chrome needs a display. xvfb provides one. An
      # installed Google Chrome would not work - recent versions ignore
      # --load-extension - hence Chrome for Testing.
      - name: Install puppeteer-core and Chrome for Testing
        run: |
          npm init -y >/dev/null
          npm install --no-save puppeteer-core@^23 @puppeteer/browsers
          npx @puppeteer/browsers install chrome@stable > chrome-install.txt
          echo "CHROME_PATH=$(awk '{print $2}' chrome-install.txt)" >> "$GITHUB_ENV"

      - name: Run regression suite
        run: xvfb-run --auto-servernum node test/run.mjs
        env:
          PUPPETEER_DIR: ${{ github.workspace }}
