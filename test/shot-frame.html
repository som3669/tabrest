<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TabRest screenshot frame</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center;
    background: linear-gradient(135deg, #eaf0ff 0%, #f7f9fc 55%, #e7ecf7 100%);
    font: 14px system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .stage { display: flex; align-items: center; gap: 56px; }
  .copy { max-width: 420px; }
  .copy h1 { font-size: 34px; line-height: 1.15; margin: 0 0 14px; color: #131722; letter-spacing: -.6px; }
  .copy p { font-size: 16px; line-height: 1.55; color: #4a5162; margin: 0; }
  .shell {
    border-radius: 16px; overflow: hidden; background: #fff;
    box-shadow: 0 12px 40px rgba(20,30,60,.18), 0 2px 8px rgba(20,30,60,.10);
  }
  iframe { width: 300px; height: 690px; border: 0; display: block; }
</style>
</head>
<body>
  <div class="stage">
    <div class="copy">
      <h1 id="h">Put idle tabs to rest</h1>
      <p id="p">Suspended tabs stop using CPU and memory. Nothing is closed — click a tab and it comes right back.</p>
    </div>
    <div class="shell"><iframe id="f" src="../popup.html"></iframe></div>
  </div>
  <script src="shot-frame.js"></script>
</body>
</html>
